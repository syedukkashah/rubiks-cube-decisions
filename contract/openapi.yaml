openapi: 3.1.0
info:
  title: Rubik's Cube Race API
  version: 1.2.0
  description: >
    Machine-readable mirror of AGENTS.md section 5 (contract v1.2.0).
    If this file and AGENTS.md disagree, AGENTS.md wins until fixed.
    Nullable fields are always present with explicit null. Responses may gain
    fields in minor versions (clients ignore unknown fields); requests with
    unknown fields are rejected with 422.
servers:
  - url: http://localhost:8000/api/v1

paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /models:
    get:
      operationId: listModels
      responses:
        "200":
          description: The four benchmarked models in fixed order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelsResponse" }

  /puzzles:
    post:
      operationId: createPuzzles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PuzzleRequest" }
      responses:
        "201":
          description: Generated puzzles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PuzzlesResponse" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      operationId: listPuzzles
      parameters:
        - name: suite
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Suite" }
      responses:
        "200":
          description: Stored puzzles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PuzzlesResponse" }
        "422": { $ref: "#/components/responses/Error" }

  /puzzles/{puzzle_id}:
    get:
      operationId: getPuzzle
      parameters:
        - { name: puzzle_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: One puzzle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Puzzle" }
        "404": { $ref: "#/components/responses/Error" }

  /benchmark:
    get:
      operationId: getBenchmark
      summary: What the one-click benchmark will do (AGENTS.md 5.10)
      responses:
        "200":
          description: Plan, available sources and the saved recording
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchmarkInfo" }

  /benchmark/sessions:
    post:
      operationId: startBenchmarkSession
      summary: Run the whole plan (warm-up, primary, optional extension) from one request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BenchmarkSessionRequest" }
      responses:
        "202":
          description: Session accepted; all runs are created up front as queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchmarkSession" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /benchmark/sessions/{session_id}:
    get:
      operationId: getBenchmarkSession
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchmarkSession" }
        "404": { $ref: "#/components/responses/Error" }

  /benchmark/sessions/{session_id}/cancel:
    post:
      operationId: cancelBenchmarkSession
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Session cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchmarkSession" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /runs:
    post:
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "202":
          description: Run accepted; executes asynchronously
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunAccepted" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            Conflict. In real mode also returned when the worst-case cost exceeds the
            remaining spend budget, another live run is active, or an identical live run
            already completed (AGENTS.md 6.1 G5, G12). The error details carry the reason.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    get:
      operationId: listRuns
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunsResponse" }

  /runs/{run_id}:
    get:
      operationId: getRun
      parameters:
        - { $ref: "#/components/parameters/RunId" }
      responses:
        "200":
          description: Full run snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunSnapshot" }
        "404": { $ref: "#/components/responses/Error" }

  /runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - { $ref: "#/components/parameters/RunId" }
      responses:
        "200":
          description: Run cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunCancelled" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      description: >
        Server-Sent Events. Each message is `id: <seq>`, `event: <type>`,
        `data: <Event JSON>`. Heartbeat comment `: ping` at least every 15 s.
        Resume with the `Last-Event-ID` header or `?after_seq=<n>`; the backend
        replays every event with seq greater than that, then continues live.
        The stream closes after `run_finished`.
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - name: after_seq
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Event stream; each data payload is an Event
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /runs/{run_id}/stats:
    get:
      operationId: getRunStats
      parameters:
        - { $ref: "#/components/parameters/RunId" }
      responses:
        "200":
          description: Per-model statistics (partial while the run is in progress)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsResponse" }
        "404": { $ref: "#/components/responses/Error" }

components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error envelope (AGENTS.md 5.2)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    # ---------- shared ----------
    Move:
      type: string
      enum: [U, "U'", U2, D, "D'", D2, L, "L'", L2, R, "R'", R2, F, "F'", F2, B, "B'", B2]
    Facelets:
      type: string
      pattern: "^[URFDLB]{54}$"
    Timestamp:
      type: string
      description: ISO-8601 UTC with Z suffix
      pattern: "Z$"
    Suite:
      type: string
      enum: [warmup, primary, extension]
    Category:
      type: string
      enum: [decision, frontier]
    RunStatus:
      type: string
      enum: [queued, running, completed, cancelled, failed]
    TrialStatus:
      type: string
      enum: [pending, running, solved, move_limit, error]
    ErrorCode:
      type: string
      enum:
        - validation_error
        - not_found
        - conflict
        - missing_api_key
        - upstream_error
        - upstream_timeout
        - internal_error

    # ---------- 5.2 ----------
    ErrorInfo:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details: { type: [object, "null"] }

    # ---------- 5.3 ----------
    Health:
      type: object
      additionalProperties: false
      required: [status, contract_version, api_key_configured]
      properties:
        status: { const: ok }
        contract_version: { type: string, example: 1.0.0 }
        api_key_configured: { type: boolean }

    # ---------- 5.4 ----------
    ModelInfo:
      type: object
      additionalProperties: false
      required: [id, label, category, interface, available]
      properties:
        id: { type: string }
        label: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        interface: { type: string, enum: [decisions_api, chat_completions] }
        available: { type: boolean }
    ModelsResponse:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelInfo" }

    # ---------- 5.5 ----------
    PuzzleRequest:
      type: object
      additionalProperties: false
      required: [suite, count]
      properties:
        suite: { $ref: "#/components/schemas/Suite" }
        count: { type: integer, minimum: 1, maximum: 50 }
        scramble_length:
          type: [integer, "null"]
          description: Must lie within the suite's range (AGENTS.md 4.3); null = random
        seed: { type: [integer, "null"] }
    Puzzle:
      type: object
      additionalProperties: false
      required: [puzzle_id, suite, scramble_moves, facelets, optimal_distance, created_at]
      properties:
        puzzle_id: { type: string }
        suite: { $ref: "#/components/schemas/Suite" }
        scramble_moves:
          type: array
          items: { $ref: "#/components/schemas/Move" }
        facelets: { $ref: "#/components/schemas/Facelets" }
        optimal_distance:
          type: [integer, "null"]
          description: Exact BFS distance for warmup/primary; null for extension
        created_at: { $ref: "#/components/schemas/Timestamp" }
    PuzzlesResponse:
      type: object
      additionalProperties: false
      required: [puzzles]
      properties:
        puzzles:
          type: array
          items: { $ref: "#/components/schemas/Puzzle" }

    # ---------- 5.6 ----------
    RunRequest:
      type: object
      additionalProperties: false
      required: [puzzle_ids]
      properties:
        puzzle_ids: { type: array, minItems: 1, items: { type: string } }
        model_ids:
          type: array
          minItems: 1
          items: { type: string }
          description: Defaults to all four models
        max_moves: { type: integer, minimum: 1, maximum: 30, default: 30 }
        timeout_s: { type: number, exclusiveMinimum: 0, default: 15 }
        max_retries: { type: integer, minimum: 0, default: 1 }
        history_window: { type: integer, minimum: 0, default: 6 }
        concurrency: { type: integer, minimum: 1, maximum: 4, default: 1 }
    RunConfig:
      type: object
      additionalProperties: false
      required: [puzzle_ids, model_ids, max_moves, timeout_s, max_retries, history_window, concurrency]
      properties:
        puzzle_ids: { type: array, items: { type: string } }
        model_ids: { type: array, items: { type: string } }
        max_moves: { type: integer }
        timeout_s: { type: number }
        max_retries: { type: integer }
        history_window: { type: integer }
        concurrency: { type: integer }
    RunAccepted:
      type: object
      additionalProperties: false
      required: [run_id, status]
      properties:
        run_id: { type: string }
        status: { const: queued }
    RunCancelled:
      type: object
      additionalProperties: false
      required: [run_id, status]
      properties:
        run_id: { type: string }
        status: { const: cancelled }
    RunSummary:
      type: object
      additionalProperties: false
      required: [run_id, status, created_at, finished_at]
      properties:
        run_id: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
    RunsResponse:
      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/RunSummary" }
    MoveRecord:
      type: object
      additionalProperties: false
      required: [index, move, facelets_before, facelets_after, latency_ms, confidence, retries]
      properties:
        index: { type: integer, minimum: 1 }
        move: { $ref: "#/components/schemas/Move" }
        facelets_before: { $ref: "#/components/schemas/Facelets" }
        facelets_after: { $ref: "#/components/schemas/Facelets" }
        latency_ms: { type: number, minimum: 0 }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        retries: { type: integer, minimum: 0 }
    Trial:
      type: object
      additionalProperties: false
      required:
        - trial_id
        - run_id
        - puzzle_id
        - model_id
        - status
        - initial_facelets
        - current_facelets
        - moves
        - moves_used
        - solved
        - invalid_move_count
        - retry_count
        - timeout_count
        - total_time_s
        - optimal_distance
        - optimality_gap
        - started_at
        - finished_at
        - error
      properties:
        trial_id: { type: string }
        run_id: { type: string }
        puzzle_id: { type: string }
        model_id: { type: string }
        status: { $ref: "#/components/schemas/TrialStatus" }
        initial_facelets: { $ref: "#/components/schemas/Facelets" }
        current_facelets: { $ref: "#/components/schemas/Facelets" }
        moves:
          type: array
          description: Applied (valid) moves only
          items: { $ref: "#/components/schemas/MoveRecord" }
        moves_used: { type: integer, minimum: 0 }
        solved: { type: boolean }
        invalid_move_count: { type: integer, minimum: 0 }
        retry_count: { type: integer, minimum: 0 }
        timeout_count: { type: integer, minimum: 0 }
        total_time_s: { type: [number, "null"] }
        optimal_distance: { type: [integer, "null"] }
        optimality_gap:
          type: [integer, "null"]
          description: moves_used - optimal_distance; only for solved trials with a non-null optimum
        started_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        finished_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        error:
          oneOf:
            - { $ref: "#/components/schemas/ErrorInfo" }
            - { type: "null" }
    RunSnapshot:
      type: object
      additionalProperties: false
      required: [run_id, status, config, created_at, started_at, finished_at, last_seq, trials]
      properties:
        run_id: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        config: { $ref: "#/components/schemas/RunConfig" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        finished_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        last_seq:
          type: integer
          minimum: 0
          description: Highest SSE seq already reflected in this snapshot
        trials:
          type: array
          items: { $ref: "#/components/schemas/Trial" }

    # ---------- 5.7 ----------
    Event:
      type: object
      additionalProperties: false
      required: [seq, type, run_id, trial_id, ts, data]
      properties:
        seq: { type: integer, minimum: 1, description: Per-run, strictly increasing }
        type:
          type: string
          enum:
            - run_started
            - trial_started
            - move_requested
            - move_invalid
            - move_applied
            - trial_finished
            - run_finished
            - error
        run_id: { type: string }
        trial_id: { type: [string, "null"], description: null for run-level events }
        ts: { $ref: "#/components/schemas/Timestamp" }
        data: { type: object }
      allOf:
        - if: { properties: { type: { const: run_started } } }
          then: { properties: { data: { $ref: "#/components/schemas/RunStartedData" } } }
        - if: { properties: { type: { const: trial_started } } }
          then: { properties: { data: { $ref: "#/components/schemas/TrialStartedData" } } }
        - if: { properties: { type: { const: move_requested } } }
          then: { properties: { data: { $ref: "#/components/schemas/MoveRequestedData" } } }
        - if: { properties: { type: { const: move_invalid } } }
          then: { properties: { data: { $ref: "#/components/schemas/MoveInvalidData" } } }
        - if: { properties: { type: { const: move_applied } } }
          then: { properties: { data: { $ref: "#/components/schemas/MoveAppliedData" } } }
        - if: { properties: { type: { const: trial_finished } } }
          then: { properties: { data: { $ref: "#/components/schemas/Trial" } } }
        - if: { properties: { type: { const: run_finished } } }
          then: { properties: { data: { $ref: "#/components/schemas/RunFinishedData" } } }
        - if: { properties: { type: { const: error } } }
          then: { properties: { data: { $ref: "#/components/schemas/ErrorInfo" } } }
    RunStartedData:
      type: object
      additionalProperties: false
      required: [trial_count]
      properties:
        trial_count: { type: integer, minimum: 0 }
    TrialStartedData:
      type: object
      additionalProperties: false
      required: [puzzle_id, model_id, initial_facelets]
      properties:
        puzzle_id: { type: string }
        model_id: { type: string }
        initial_facelets: { $ref: "#/components/schemas/Facelets" }
    MoveRequestedData:
      type: object
      additionalProperties: false
      required: [move_index, attempt]
      properties:
        move_index: { type: integer, minimum: 1 }
        attempt: { type: integer, minimum: 1, description: 1 + retries so far }
    MoveInvalidData:
      type: object
      additionalProperties: false
      required: [move_index, attempt, reason, raw_response]
      properties:
        move_index: { type: integer, minimum: 1 }
        attempt: { type: integer, minimum: 1 }
        reason: { type: string, enum: [illegal_move, malformed_response, timeout, upstream_error] }
        raw_response: { type: string }
    MoveAppliedData:
      type: object
      additionalProperties: false
      required:
        - index
        - move
        - facelets_before
        - facelets_after
        - latency_ms
        - confidence
        - retries
        - moves_used
        - solved
      properties:
        index: { type: integer, minimum: 1 }
        move: { $ref: "#/components/schemas/Move" }
        facelets_before: { $ref: "#/components/schemas/Facelets" }
        facelets_after: { $ref: "#/components/schemas/Facelets" }
        latency_ms: { type: number, minimum: 0 }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        retries: { type: integer, minimum: 0 }
        moves_used: { type: integer, minimum: 0 }
        solved: { type: boolean }
    RunFinishedData:
      type: object
      additionalProperties: false
      required: [status, finished_at]
      properties:
        status: { type: string, enum: [completed, cancelled, failed] }
        finished_at: { $ref: "#/components/schemas/Timestamp" }

    # ---------- 5.8 ----------
    ModelStats:
      type: object
      additionalProperties: false
      required:
        - model_id
        - label
        - category
        - trials
        - solved_trials
        - success_rate_pct
        - avg_move_latency_ms
        - avg_total_time_s
        - total_moves
        - avg_moves_per_trial
        - avg_optimality_gap
        - invalid_move_count
        - retry_count
        - timeout_count
      properties:
        model_id: { type: string }
        label: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        trials: { type: integer, minimum: 0 }
        solved_trials: { type: integer, minimum: 0 }
        success_rate_pct:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: null only while the model has no trials to rate yet (partial stats)
        avg_move_latency_ms: { type: [number, "null"] }
        avg_total_time_s: { type: [number, "null"] }
        total_moves: { type: integer, minimum: 0, description: Sum of moves_used over the model's trials }
        avg_moves_per_trial: { type: [number, "null"] }
        avg_optimality_gap: { type: [number, "null"] }
        invalid_move_count: { type: integer, minimum: 0 }
        retry_count: { type: integer, minimum: 0 }
        timeout_count: { type: integer, minimum: 0 }
    QuestionsAnswered:
      type: object
      additionalProperties: false
      required:
        - fastest_model_id
        - highest_solve_rate_model_id
        - best_optimality_gap_model_id
        - fastest_is_also_best_quality
      properties:
        fastest_model_id: { type: [string, "null"] }
        highest_solve_rate_model_id: { type: [string, "null"] }
        best_optimality_gap_model_id: { type: [string, "null"] }
        fastest_is_also_best_quality: { type: [boolean, "null"] }
    StatsResponse:
      type: object
      additionalProperties: false
      required: [run_id, run_status, models, questions_answered]
      properties:
        run_id: { type: string }
        run_status: { $ref: "#/components/schemas/RunStatus" }
        models:
          type: array
          description: One entry per model in the run, same order as config.model_ids
          items: { $ref: "#/components/schemas/ModelStats" }
        questions_answered: { $ref: "#/components/schemas/QuestionsAnswered" }

    # ---------- 5.10 ----------
    BenchmarkSource:
      type: string
      enum: [simulated, live, replay]
    BenchmarkRequestedSource:
      type: string
      enum: [auto, simulated, live, replay]
    BenchmarkStep:
      type: string
      enum: [warmup, primary, extension]
    PlanStep:
      type: object
      additionalProperties: false
      required: [step, suite, count, seed, max_moves, optional]
      properties:
        step: { $ref: "#/components/schemas/BenchmarkStep" }
        suite: { $ref: "#/components/schemas/Suite" }
        count: { type: integer, minimum: 1 }
        seed: { type: integer }
        max_moves: { type: integer, minimum: 1, maximum: 30 }
        optional: { type: boolean }
    Recording:
      type: object
      additionalProperties: false
      required: [recording_id, recorded_at, session_id, trial_count, total_cost_usd]
      properties:
        recording_id: { type: string }
        recorded_at: { $ref: "#/components/schemas/Timestamp" }
        session_id: { type: string }
        trial_count: { type: integer, minimum: 0 }
        total_cost_usd: { type: [number, "null"], minimum: 0 }
    BenchmarkInfo:
      type: object
      additionalProperties: false
      required: [plan, sources, auto_source, recording]
      properties:
        plan:
          type: array
          items: { $ref: "#/components/schemas/PlanStep" }
        sources:
          type: object
          additionalProperties: false
          required: [simulated, live, replay]
          properties:
            simulated: { type: boolean }
            live: { type: boolean }
            replay: { type: boolean }
        auto_source: { enum: [simulated, replay] }
        recording: { oneOf: [{ $ref: "#/components/schemas/Recording" }, { type: "null" }] }
    BenchmarkSessionRequest:
      type: object
      additionalProperties: false
      properties:
        source: { $ref: "#/components/schemas/BenchmarkRequestedSource", default: auto }
        speed: { type: number, minimum: 0.25, maximum: 20, default: 1.0 }
        include_extension: { type: boolean, default: true }
        confirm_cost: { type: boolean, default: false }
    BenchmarkSessionRun:
      type: object
      additionalProperties: false
      required: [step, suite, run_id, status]
      properties:
        step: { $ref: "#/components/schemas/BenchmarkStep" }
        suite: { $ref: "#/components/schemas/Suite" }
        run_id: { type: string }
        status:
          type: string
          enum: [queued, running, completed, cancelled, failed, skipped]
    BenchmarkSession:
      type: object
      additionalProperties: false
      required: [session_id, source, requested_source, status, speed, created_at, finished_at, replay_of_session_id, recorded_at, total_cost_usd, runs]
      properties:
        session_id: { type: string }
        source: { $ref: "#/components/schemas/BenchmarkSource" }
        requested_source: { $ref: "#/components/schemas/BenchmarkRequestedSource" }
        status: { $ref: "#/components/schemas/RunStatus" }
        speed: { type: number }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        replay_of_session_id: { type: [string, "null"] }
        recorded_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        total_cost_usd: { type: [number, "null"], minimum: 0 }
        runs:
          type: array
          items: { $ref: "#/components/schemas/BenchmarkSessionRun" }
